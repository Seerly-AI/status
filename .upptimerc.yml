# Upptime configuration for the Seerly public status page.
# Docs: https://upptime.js.org/docs/configuration
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ THIS FILE LIVES IN A PUBLIC GITHUB REPOSITORY.                           │
# │ Every URL below is published to the status site, to history/summary.json │
# │ and to auto-created incident issues.                                     │
# │ NEVER add a third-party vendor URL or vendor name as a monitor.          │
# │ Dependency health is exposed ONLY through our own anonymized             │
# │ /health/deps/* proxy endpoints. See SETUP.md.                            │
# └──────────────────────────────────────────────────────────────────────────┘

owner: Seerly-AI # GitHub username or organization
repo: status # GitHub repository name
user-agent: Seerly-AI # Sent on GitHub API requests (docs recommend the GH username)

sites:
  - name: Website
    url: https://seerly.app/
  - name: Blog & Content
    url: https://seerly.app/blog
  - name: App / Dashboard
    url: https://seerly.app/login
  # ONLY PUBLISH WHAT WE CAN INDEPENDENTLY VERIFY.
  #
  # Every row below is probed through the airo-backend API process, so when that process
  # is unhealthy the probe fails and Upptime reports the component "down" — even if the
  # component itself is perfectly fine. On 2026-07-31 an unhealthy backend container
  # opened four incidents (#2-#5), two of which were FALSE: Postgres was healthy and the
  # seerly-agents service (a separate VM) was running the whole time. We had no evidence
  # for either claim; we simply could not reach the process that asks.
  #
  # The fix is to name every row for the CAPABILITY a user loses, never for the box we
  # think broke. "AI Agents is down" was read as a claim about the seerly-agents service,
  # which was running fine; "Agent execution is down" is true either way, because agent
  # runs are delivered through the API and are genuinely unavailable when it is unhealthy.
  #
  # "Database" is gone entirely — folded into Core API, which now probes /health/ready
  # (liveness + database). A database the API cannot reach makes the API unusable, so it
  # is reported as one observed fact instead of a separate claim about Postgres that
  # nothing here can verify.
  #
  # The /health/db and /health/agents endpoints still exist and are still correct — use
  # them for internal alerting, where "the API cannot reach Postgres" is exactly the
  # signal you want. They just cannot support a public claim about those components.
  #
  # To report the agents service itself (independent of the API), it has to be observed
  # independently: either a public health endpoint on the agents VM, or an outbound
  # heartbeat whose freshness is monitored. Until then this row tracks the capability.
  # PENDING: switch to /api/health/ready once airo-backend is deployed.
  #
  # /health/ready (liveness + database) is where the removed "Database" row goes: a
  # database the API cannot reach makes the API unusable, so it becomes one observed fact
  # rather than a separate claim about Postgres we cannot verify independently.
  #
  # It deliberately is NOT /health — that endpoint is the container's own HEALTHCHECK
  # (Dockerfile:81 and every compose file), so it must stay dependency-free: a 503 on a
  # Postgres blip would fail the probe 3x and restart the container, making the status
  # page cause outages instead of reporting them.
  #
  # Left on /health until the deploy lands, because pointing this row at an endpoint that
  # still 404s would open a false incident — the exact failure this whole change fixes.
  - name: Core API
    url: https://seerly.app/api/health
  - name: Background Jobs
    url: https://seerly.app/api/health/queues
  # Was "AI Agents", which read as a claim about the seerly-agents service — a service
  # that was running throughout the 2026-07-31 incident. This name describes the
  # capability instead, which is accurate whether the agents VM or the API is at fault.
  - name: Agent execution
    url: https://seerly.app/api/health/agents
  # Capability names, not vendor names. "AI Providers is down" would blame a third party
  # for what is usually our own outage; "AI generation" describes what users lose, which
  # is true whether the vendor or our API is at fault.
  - name: AI generation
    url: https://seerly.app/api/health/deps/ai
  - name: Payments
    url: https://seerly.app/api/health/deps/payments
  - name: Email Delivery
    url: https://seerly.app/api/health/deps/email

# Upptime's time-series "database" is the git commit history of history/<slug>.yml —
# calculate-response-time.ts derives every data point by parsing response times out of
# commit messages. Two commands write those commits:
#   * Uptime CI       -> update()      commits ONLY when a site changes up/down/degraded
#   * Response Time CI-> update(true)  runs a fresh check and ALWAYS commits
# So response-time resolution is set by the Response Time CI cron, not the uptime one.
# Upptime's default is "0 23 * * *" — a single data point per day. Hourly gives 24x the
# resolution at the cost of ~10 commits per run (one per site).
#
# NOTE: these workflow files are GENERATED from this block. Do not edit
# .github/workflows/*.yml by hand — change the cron here and let CI regenerate them.
workflowSchedule:
  responseTime: "0 * * * *" # hourly (was daily) — response-time data points
  uptime: "*/5 * * * *" # up/down detection; GitHub throttles this heavily in practice

status-website:
  cname: status.seerly.app

  # `name` is not just navbar text — Upptime uses it as the <title>. Setting it to
  # "Status" alone (to avoid repeating the wordmark logo) left the browser tab, bookmarks
  # and search results reading simply "Status", which is useless out of context.
  #
  # Fixed at the other end instead: the logo is now the square Seerly mark rather than the
  # wordmark, so "Seerly Status" beside it reads correctly and the title is meaningful.
  # As a bonus this drops a 309 KB navbar image to 36 KB.
  name: Seerly Status

  # ---------------------------------------------------------------------------------
  # GitHub proxy (worker/). Live and verified 2026-07-27.
  #
  # The status page calls GitHub from the visitor's browser, where unauthenticated
  # requests are capped at 60/hour PER IP — shared by everyone behind the same NAT. Each
  # page load spends ~3 API calls, so shared addresses hit GitHub's "Rate limit exceeded"
  # page instead of this one, worst during an incident when traffic spikes.
  #
  # The Worker authenticates server-side and caches for 60s at Cloudflare's edge.
  # Measured through it: X-RateLimit-Limit 5000 (vs 60 direct).
  #
  # BOTH keys are required. apiBaseUrl covers the Octokit calls (incidents, maintenance);
  # userContentBaseUrl covers the graphs and summary data on raw.githubusercontent.com.
  # Setting only one leaves half the page on the unauthenticated path.
  #
  # Hosted on *.workers.dev rather than status-api.seerly.app because the seerly.app zone
  # lives in a Cloudflare account where this login has no Workers role. The hostname is
  # only ever read by the page's JavaScript, never shown to visitors. See worker/README.md.
  apiBaseUrl: https://seerly-status-proxy.rakesh-menon-account.workers.dev/api
  userContentBaseUrl: https://seerly-status-proxy.rakesh-menon-account.workers.dev/raw
  # ---------------------------------------------------------------------------------

  introTitle: "**Seerly** system status"
  # Do NOT promise a check frequency here. The workflows request */5, but GitHub
  # queues scheduled Actions and runs them when a machine is free — measured gaps on
  # Upptime's own reference instance are 56–221 minutes. Claiming "every few minutes"
  # is a promise this page cannot keep. What IS true and worth saying: the monitoring
  # runs entirely outside Seerly's own infrastructure, so an outage here cannot hide
  # an outage there.
  introMessage:
    Every component below is checked automatically from outside Seerly's own
    infrastructure, so this page keeps reporting even when Seerly is down. Uptime and
    response times update throughout the day.

  # `theme` is the base; `themeUrl` overrides it with the Seerly palette.
  theme: dark
  themeUrl: https://status.seerly.app/seerly.css

  # Logo and favicon are served from THIS repo's assets/ directory (published at the
  # site root), NOT from seerly.app. A status page must not load assets from the
  # infrastructure it monitors — otherwise it renders broken during the exact outage
  # it exists to report.
  logoUrl: https://status.seerly.app/apple-touch-icon.png
  favicon: https://status.seerly.app/favicon.ico

  # --- Metadata -------------------------------------------------------------------
  # `metaTags` renders ONLY name/content pairs — verified in the built bundle, which does
  # T(n,"name",...) and T(n,"content",...) with no `property` support. Twitter cards use
  # name=, so they work here; Open Graph uses property= and must go in customHeadHtml.
  metaTags:
    - name: description
      content:
        Live operational status for Seerly — website, dashboard, API, database, background
        jobs, AI agents and integrations. Monitored independently of Seerly's own
        infrastructure.
    - name: robots
      content: index, follow
    # NOTE: theme-color is deliberately NOT set here. Upptime hardcodes
    # <meta name="theme-color" content="#333333"> near the top of <head>, and both
    # metaTags and customHeadHtml are injected after it. Browsers honour the FIRST
    # theme-color, so ours was silently ignored — verified in the deployed HTML
    # (#333333 at char 125, ours at 1942). Changing it needs a patch to the upstream
    # status-page template, not config. #333333 is close enough to the #09090b theme
    # background that it is not worth forking over.
    - name: twitter:card
      content: summary_large_image
    - name: twitter:title
      content: Seerly Status
    - name: twitter:description
      content: Live operational status for Seerly, monitored independently of Seerly's own infrastructure.
    - name: twitter:image
      content: https://status.seerly.app/og-image.png

  # Open Graph needs property=, which metaTags cannot emit. Assets are served from THIS
  # repo, not seerly.app, for the same reason as the logo and stylesheet: the status page
  # must not depend on the infrastructure it reports on.
  customHeadHtml: >-
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Seerly" />
    <meta property="og:title" content="Seerly Status" />
    <meta property="og:description" content="Live operational status for Seerly, monitored independently of Seerly's own infrastructure." />
    <meta property="og:url" content="https://status.seerly.app/" />
    <meta property="og:image" content="https://status.seerly.app/og-image.png" />
    <link rel="canonical" href="https://status.seerly.app/" />
  # --------------------------------------------------------------------------------

  # No "Status" entry: it links to the page you are already on, and the navbar name
  # already says Status. No "Seerly" entry either — the logo is the brand, and it
  # links here; these link OUT, so they are named for where they go.
  navbar:
    - title: Website
      href: https://seerly.app
    - title: Blog
      href: https://seerly.app/blog
    - title: Contact
      href: https://seerly.app/contact
