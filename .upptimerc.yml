# Upptime configuration for the Seerly public status page.
# Docs: https://upptime.js.org/docs/configuration
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ THIS FILE LIVES IN A PUBLIC GITHUB REPOSITORY.                           │
# │ Every URL below is published to the status site, to history/summary.json │
# │ and to auto-created incident issues.                                     │
# │ NEVER add a third-party vendor URL or vendor name as a monitor.          │
# │ Dependency health is exposed ONLY through our own anonymized             │
# │ /health/deps/* proxy endpoints. See SETUP.md.                            │
# └──────────────────────────────────────────────────────────────────────────┘

owner: Seerly-AI # GitHub username or organization
repo: status # GitHub repository name
user-agent: Seerly-AI # Sent on GitHub API requests (docs recommend the GH username)

sites:
  - name: Website
    url: https://seerly.app/
  - name: Blog & Content
    url: https://seerly.app/blog
  - name: App / Dashboard
    url: https://seerly.app/login
  - name: Core API
    url: https://seerly.app/api/health
  - name: Database
    url: https://seerly.app/api/health/db
  - name: Background Jobs
    url: https://seerly.app/api/health/queues
  - name: AI Agents
    url: https://seerly.app/api/health/agents
  - name: AI Providers
    url: https://seerly.app/api/health/deps/ai
  - name: Payments
    url: https://seerly.app/api/health/deps/payments
  - name: Email Delivery
    url: https://seerly.app/api/health/deps/email

# Upptime's time-series "database" is the git commit history of history/<slug>.yml —
# calculate-response-time.ts derives every data point by parsing response times out of
# commit messages. Two commands write those commits:
#   * Uptime CI       -> update()      commits ONLY when a site changes up/down/degraded
#   * Response Time CI-> update(true)  runs a fresh check and ALWAYS commits
# So response-time resolution is set by the Response Time CI cron, not the uptime one.
# Upptime's default is "0 23 * * *" — a single data point per day. Hourly gives 24x the
# resolution at the cost of ~10 commits per run (one per site).
#
# NOTE: these workflow files are GENERATED from this block. Do not edit
# .github/workflows/*.yml by hand — change the cron here and let CI regenerate them.
workflowSchedule:
  responseTime: "0 * * * *" # hourly (was daily) — response-time data points
  uptime: "*/5 * * * *" # up/down detection; GitHub throttles this heavily in practice

status-website:
  cname: status.seerly.app
  name: Seerly Status
  introTitle: "**Seerly** system status"
  introMessage: Live health of Seerly components, checked every few minutes.

  # `theme` is the base; `themeUrl` overrides it with the Seerly palette.
  theme: dark
  themeUrl: https://status.seerly.app/seerly.css

  # Logo and favicon are served from THIS repo's assets/ directory (published at the
  # site root), NOT from seerly.app. A status page must not load assets from the
  # infrastructure it monitors — otherwise it renders broken during the exact outage
  # it exists to report.
  logoUrl: https://status.seerly.app/seerly-logo.png
  favicon: https://status.seerly.app/favicon.ico

  navbar:
    - title: Status
      href: /
    - title: Seerly
      href: https://seerly.app
    - title: Blog
      href: https://seerly.app/blog
    - title: Contact
      href: https://seerly.app/contact
